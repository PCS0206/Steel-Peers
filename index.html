<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steel Peers</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="map"></canvas>

<div id="topbar">
  <span id="date">—</span>
  <span class="speeds">
    <button data-speed="0" title="일시정지 (Space)">⏸</button>
    <button data-speed="1">▶</button>
    <button data-speed="2">▶▶</button>
    <button data-speed="3">▶▶▶</button>
  </span>
  <span id="pp"></span>
  <span id="wars"></span>
</div>

<aside id="panel"></aside>
<div id="log"></div>
<div id="banner"></div>

<div id="overlay">
  <div class="card">
    <h1>STEEL PEERS</h1>
    <p>지역을 점령하고 사단을 생산해 대륙을 제패하라.</p>
    <label>시드 <input id="seed" type="number" value="1"></label>
    <label>국가 수 <select id="ncountries"><option>4</option><option>5</option><option selected>6</option><option>7</option></select></label>
    <button id="start">새 게임</button>
    <p class="hint">좌클릭: 선택 · 우클릭: 이동 명령 · 드래그: 지도 이동 · 휠: 확대/축소 · Space: 일시정지 · 1~3: 속도</p>
  </div>
</div>

<script src="js/map.js"></script>
<script src="js/game.js"></script>
<script src="js/ai.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
